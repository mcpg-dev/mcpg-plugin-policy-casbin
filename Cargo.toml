[package]
name = "mcpg-plugin-policy-casbin"
version = "0.1.0-alpha.16"
license = "BUSL-1.1"
edition = "2024"
description = "Casbin policy_engine plugin for MCPG gateway (dev.mcpg.policy.casbin)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-cluster-api = { git = "https://github.com/mcpg-dev/mcpg-cluster-api", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
# `static-firstparty` exposes
# `HostHandle::from_services` for in-process construction in tests
# without affecting the cdylib build path.
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", features = ["static-firstparty"] }
mcpg-bundle-reload = { git = "https://github.com/mcpg-dev/mcpg-bundle-reload", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", default-features = false }
async-trait = "0.1"
bytes = "1"
metrics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"

# casbin-rs — the canonical Rust port. `explain` enables
# enforce_explain (deny-reason mapping); `incremental` is default-
# on for live policy edits (we don't expose them in v0.1 but the
# default keeps the option open for v0.2). `runtime-tokio` lets
# the enforcer's async APIs use the workspace's tokio runtime.
casbin = { version = "2", default-features = false, features = ["explain", "logging", "incremental", "runtime-tokio"] }

# Bundled tokio runtime for sync-FFI evaluate dispatching to
# casbin-rs's async APIs. Same shape as policy-opa's pattern.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
# Recorder-based HostHandle integration tests
# need the host-side `HostServices` trait to build a test double.

async-trait = "0.1"

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's `declare_policy_engine_plugin!` `build_static`
# accessor (gated `#[cfg(feature = "static-firstparty")]`) does not
# trigger `unexpected_cfgs` in consumer compilation. Empty: this plugin
# is consumed as a cdylib, not via the static-firstparty fast path.
static-firstparty = []
